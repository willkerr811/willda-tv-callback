<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Willda TV · Spotify</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0b0a; color: #f6f3ee;
         font: 16px/1.5 -apple-system, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; }
  h1 { font: italic 400 40px/1.1 Georgia, serif; margin: 0 0 12px; }
  p { color: #b3ada4; margin: 0 0 12px; }
  a { color: #f3b54a; }
</style>
</head>
<body>
<main>
  <h1 id="title">Connecting…</h1>
  <p id="detail">Handing your Spotify sign-in back to Willda TV.</p>
</main>
<script>
  // Spotify only redirects to HTTPS pages, but Willda TV lives on your home
  // network. This page forwards the one-time sign-in code to the TV address
  // carried in `state`, and only ever to a private (home network) address.
  "use strict";
  const params = new URLSearchParams(location.search);
  const title = document.getElementById("title");
  const detail = document.getElementById("detail");
  const state = params.get("state") || "";
  const host = state.split("~")[1] || "";
  const privateHost = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|127\.0\.0\.1|localhost):\d{2,5}$/;

  if (params.get("error")) {
    title.textContent = "Not connected";
    detail.textContent = params.get("error") === "access_denied"
      ? "Spotify access was cancelled. Go back to Willda TV setup to try again."
      : "Spotify said: " + params.get("error");
  } else if (!params.get("code") || !privateHost.test(host)) {
    title.textContent = "Nothing to do here";
    detail.textContent = "This page only finishes a Spotify sign-in started from Willda TV setup.";
  } else {
    const target = "http://" + host + "/spotify/callback?" + new URLSearchParams({ code: params.get("code"), state }).toString();
    // Keep the code out of history, then hand it to the TV.
    history.replaceState(null, "", location.pathname);
    detail.innerHTML = 'If nothing happens, make sure the TV is showing Willda TV setup, then <a id="go">tap here</a>.';
    document.getElementById("go").href = target;
    location.replace(target);
  }
</script>
</body>
</html>
